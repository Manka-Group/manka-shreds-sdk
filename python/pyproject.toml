[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manka-shreds-sdk"
version = "0.1.0"
description = "Subscriber client for the manka-shreds Solana shred stream"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["solana", "shred", "manka-shreds", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
# No required dependencies. Python 3.14 carries zstd in the standard library, which is the only
# thing a TCP subscriber needs beyond asyncio — the same reasoning as the TypeScript SDK requiring
# Node 22.15. QUIC needs a native implementation and is an extra.
dependencies = []

[project.optional-dependencies]
quic = ["aioquic>=1.2"]

[project.urls]
Homepage = "https://docs.manka.wtf"
Documentation = "https://docs.manka.wtf"
Repository = "https://github.com/Manka-Group/manka-shreds-sdk"
Issues = "https://github.com/Manka-Group/manka-shreds-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/manka_shreds_sdk"]

[dependency-groups]
dev = ["pytest>=8", "aioquic>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
